name: Ajustes responsive móvil

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Ajustes responsive móvil aplicados\n'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ajustar interfaz móvil
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''@media(max-width:900px){.app{display:block}aside{height:auto;position:sticky;top:0;z-index:20;padding:10px}.brand{margin-bottom:9px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.navtitle{display:none}main{padding:20px}.top{display:block}.stats{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:1fr}.drawer{padding:20px}}'''
          new = '''@media(max-width:900px){
          .app{display:block}
          aside{height:auto;position:sticky;top:0;z-index:20;padding:8px 10px;box-shadow:0 2px 10px #10182718}
          .brand{margin-bottom:7px}
          .search{padding:9px;margin-bottom:8px}
          nav{display:flex;overflow-x:auto;gap:3px;scrollbar-width:none}
          nav::-webkit-scrollbar{display:none}
          nav button{white-space:nowrap;padding:7px 9px;font-size:12px}
          .navtitle{display:none}
          main{padding:12px 14px 24px}
          .top{display:block}
          .eyebrow{font-size:9px}
          h1{font-size:25px;margin:3px 0 5px}
          .intro{font-size:12px;line-height:1.45;margin:0 0 8px}
          .top>.toolbar{display:none}
          .results{margin:7px 0}
          .stats{grid-template-columns:repeat(2,1fr);gap:6px;margin:9px 0}
          .stat{padding:8px 10px;border-radius:9px}
          .stat b{font-size:18px}
          .stat span{font-size:10px}
          .sectionbar{margin:12px 0 7px}
          .sectionbar h2{font-size:16px}
          .sectionbar span{font-size:10px}
          .quick{grid-template-columns:repeat(4,1fr);gap:5px}
          .quick button{min-height:0;height:58px;padding:7px 6px;border-radius:8px}
          .quick strong{font-size:11px;margin-bottom:2px}
          .quick span{display:block;font-size:8px;line-height:1.2}
          .grid{grid-template-columns:1fr;gap:8px}
          .card{min-height:0;padding:12px;border-radius:10px}
          .card h3{font-size:15px;margin:7px 0 4px}
          .card p{-webkit-line-clamp:4;font-size:12px;line-height:1.4}
          .card .source{padding-top:7px;font-size:9px}
          .integrity{padding:12px;margin-top:12px;border-radius:10px}
          .integrity span{font-size:11px}
          .drawer{width:100%;padding:14px 14px 20px}
          .drawerhead{gap:10px}
          .drawerhead h2{font-size:20px;margin:5px 0}
          .close{font-size:26px}
          .promptbox{padding:11px;margin:10px 0;border-radius:10px}
          .promptbox textarea{min-height:0;height:auto;max-height:none;overflow-y:hidden;font-size:12px;line-height:1.45;padding:10px;resize:vertical}
          .promptbox .toolbar{gap:5px;margin:8px 0}
          .promptbox .btn{padding:7px 8px;font-size:11px}
          .note{min-height:80px}
          }'''
          if old not in s:
              raise SystemExit('No se encontró el bloque responsive esperado')
          s = s.replace(old, new, 1)

          old_js = '''function promptUI(x){return `<div class=\"promptbox\"><b>Prompt reutilizable</b><p style=\"font-size:12px;color:#b9c5d6\">Puedes modificarlo antes de copiarlo o usarlo.</p><textarea id=\"promptText\">${esc(x.text)}</textarea><div class=\"toolbar\"><button class=\"btn primary\" id=\"copyPrompt\">Copiar prompt</button><button class=\"btn\" id=\"openChat\">Copiar y abrir ChatGPT</button><button class=\"btn\" id=\"resetPrompt\">Restablecer</button></div></div>`}'''
          new_js = '''function promptUI(x){return `<div class=\"promptbox\"><b>Prompt reutilizable</b><p style=\"font-size:12px;color:#b9c5d6\">Puedes modificarlo antes de copiarlo o usarlo.</p><textarea id=\"promptText\">${esc(x.text)}</textarea><div class=\"toolbar\"><button class=\"btn primary\" id=\"copyPrompt\">Copiar prompt</button><button class=\"btn\" id=\"openChat\">Copiar y abrir ChatGPT</button><button class=\"btn\" id=\"resetPrompt\">Restablecer</button></div></div>`}'''
          if old_js not in s:
              raise SystemExit('No se encontró promptUI')
          s = s.replace(old_js, new_js, 1)

          old_open = "$('viewer').style.display='flex';$('related').querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>openItem(b.dataset.rel));if(current.template){$('copyPrompt').onclick=()=>navigator.clipboard.writeText($('promptText').value);"
          new_open = "$('viewer').style.display='flex';$('related').querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>openItem(b.dataset.rel));if(current.template){const ta=$('promptText');requestAnimationFrame(()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'});ta.oninput=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};$('copyPrompt').onclick=()=>navigator.clipboard.writeText($('promptText').value);"
          if old_open not in s:
              raise SystemExit('No se encontró apertura del prompt')
          s = s.replace(old_open, new_open, 1)

          old_click = "document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{filter=b.dataset.type;nav();render()});nav();render();"
          new_click = "document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{filter=b.dataset.type;nav();render();if(window.matchMedia('(max-width:900px)').matches){requestAnimationFrame(()=>document.getElementById('listTitle').scrollIntoView({behavior:'smooth',block:'start'}))}});nav();render();"
          if old_click not in s:
              raise SystemExit('No se encontró manejador de navegación')
          s = s.replace(old_click, new_click, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Ajustes responsive móvil aplicados'
          git push
