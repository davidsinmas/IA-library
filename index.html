<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA Library</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside><div class="brand"><span>IA</span><div><b>IA Library</b><small>Biblioteca personal</small></div></div>
    <input id="search" placeholder="Buscar recursos…">
    <nav id="categories"></nav>
    <div class="aside-foot">Recursos <b id="count">0</b></div>
  </aside>
  <main>
    <header><div><div class="eyebrow">BIBLIOTECA DE IA</div><h1 id="heading">Todos</h1><p id="subheading" class="subtitle">Biblioteca organizada por áreas de uso</p></div><button id="settings">⚙ Configuración</button></header>
    <section id="cards" class="cards"></section>
  </main>
  <section id="viewer" class="viewer hidden"><div class="viewer-head"><div><span id="vcat"></span><h2 id="vtitle"></h2></div><button id="close">×</button></div>
    <div id="vbody" class="content"></div><textarea id="edit" class="hidden"></textarea>
    <div class="actions"><button id="copy">Copiar</button><button id="custom">Personalizar</button><button id="ask">Trabajar con IA</button></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="x" id="mx">×</button><h2>Trabajar con IA</h2><p>La consulta se enviará a OpenAI junto con el recurso seleccionado.</p><textarea id="question" placeholder="¿Qué quieres hacer con este recurso?"></textarea><input id="apikey" type="password" placeholder="API key de OpenAI (se guarda solo en este navegador)"><button id="send">Consultar</button><pre id="answer"></pre></div></div>
<script src="app.js"></script><script src="sections.js"></script>
</body></html>
